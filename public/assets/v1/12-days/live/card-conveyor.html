</svg>
<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const P=1.6;            // seconds per card
const NDES=6;           // card designs
const STEP=308.5;       // belt spacing
const X0=107.03, BOTTOM=731.73;
const HIT=3.42;
const SHY=BOTTOM-14, SHRX=84, SHRY=16; // drop shadow spot          // cycles after landing when the paw hits
const DROP=0.38;        // cycles the drop takes
const $=id=>document.getElementById(id);
// belt lines
const lines=$('lines');
for(let k=-5;k<28;k++){const l=document.createElementNS(NS,'path');
  l.setAttribute('d',`M${100+k*45.43} 568.83V742.72`);l.setAttribute('stroke','#020202');l.setAttribute('stroke-width','1.5');l.setAttribute('stroke-linecap','round');lines.appendChild(l);}
// pools
function pool(parent,n){const a=[];for(let i=0;i<n;i++){const g=document.createElementNS(NS,'g');const u=document.createElementNS(NS,'use');g.appendChild(u);parent.appendChild(g);a.push(g)}return a}
const beltP=pool($('beltCards'),7), knockP=pool($('knocked'),3), dropP=pool($('dropCards'),2);
const shadow=$('shadow');
const speed=$('speed'); const SL=[[-52,-120,0.0],[-30,-170,0.15],[167,-150,0.05],[191,-60,0.25],[213,-110,0.1]];
const speedEls=SL.map(()=>{const l=document.createElementNS(NS,'path');speed.appendChild(l);return l});
// machine lights
const dots=[...document.querySelectorAll('#stage .dot')];
const base=dots.map(d=>d.getAttribute('fill'));
const COLS=['#F7DA10','#F65C4F','#0BDD48','#020202','#FFFFFF'];
const hash=(a,b)=>{let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967296};
const stars=[...document.querySelectorAll('#stage .star')].map(c=>[c,+c.getAttribute('r')]);
const paw=$('pawWrap'), pawOpen=$('paw'), pawClosed=$('pawClosed');
const lerp=(a,b,u)=>a+(b-a)*u, cl=u=>Math.max(0,Math.min(1,u));
const eio=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2, eout=u=>1-Math.pow(1-u,3);
function setCard(g,j,tf){g.style.display='';g.firstChild.setAttribute('href','#c'+(((j%NDES)+NDES)%NDES));g.setAttribute('transform',tf)}
function render(t){ // t in cycles
  const step=((Math.floor(t*P*10)%96)+96)%96;
  dots.forEach((d,i)=>{const r=hash(i+1,step+1);d.setAttribute('fill',r<0.38?COLS[Math.floor(hash(i+7,step+3)*COLS.length)]:base[i]);});
  // stars twinkle: sit a little dim, flash bright a few times per loop on their own beat (whole flashes per loop)
  stars.forEach(([c,r0],i)=>{const k=2+(i*5)%4, ph=(i*2.399)%(2*Math.PI);
    const fl=Math.pow(Math.max(0,Math.sin(2*Math.PI*k*t/NDES+ph)),6); c.setAttribute('r',(r0*(0.8+0.55*fl)).toFixed(2));});
  // belt texture
  lines.setAttribute('transform',`translate(${(t*STEP)%45.43} 0)`);
  let bi=0,ki=0,di=0; shadow.style.display='none'; speedEls.forEach(e=>e.setAttribute('opacity',0));
  const jf=Math.floor(t);
  for(let j=jf-5;j<=jf+1;j++){
    const d=t-j;
    if(d<-DROP) continue;
    if(d<0){ // dropping
      const s=(d+DROP)/DROP, y=-860*(1-s*s);
      setCard(dropP[di++],j,`translate(${X0} ${BOTTOM+y})`);
      // cartoon drop shadow: a solid black spot on the belt that swells as the card gets close
      const k=0.12+0.88*s*s; shadow.style.display='';
      shadow.setAttribute('cx',X0+74); shadow.setAttribute('cy',SHY);
      shadow.setAttribute('rx',(SHRX*k).toFixed(2)); shadow.setAttribute('ry',(SHRY*k).toFixed(2));
      const op=Math.sin(Math.PI*cl(s*1.15))*1;
      SL.forEach((L,i)=>{const len=90+140*s, top=BOTTOM-225+y+L[1]-L[2]*80;
        speedEls[i].setAttribute('d',`M${X0+L[0]} ${top}V${top+len}`);speedEls[i].setAttribute('opacity',op.toFixed(3));});
      continue;
    }
    if(d<HIT){ // on belt
      let tf=`translate(${X0+STEP*d} ${BOTTOM})`;
      if(d<0.14){const u=d/0.14, sq=Math.sin(Math.PI*u)*0.09*(1-u*.5);tf+=` translate(74 0) scale(${1+sq*.6} ${1-sq}) translate(-74 0)`;}
      setCard(beltP[bi++],j,tf); continue;
    }
    const tau=(d-HIT)*P; if(tau>1.4||ki>=knockP.length) continue;
    const x=X0+STEP*HIT+460*tau, y=BOTTOM-260*tau+0.5*2800*tau*tau, r=200*tau;
    setCard(knockP[ki++],j,`translate(${x} ${y}) rotate(${r} 74 -112)`);
  }
  for(;bi<beltP.length;bi++)beltP[bi].style.display='none';
  for(;ki<knockP.length;ki++)knockP[ki].style.display='none';
  for(;di<dropP.length;di++)dropP[di].style.display='none';
  // paw: hit happens at d==HIT for the card at the end of the belt
  const pd=((t-HIT)%1+1)%1; const dd=pd>0.5?pd-1:pd; // -0.5..0.5 around hit
  let px=0,py=0,pr=0;
  if(dd>=-0.32&&dd<-0.06){const u=eio((dd+0.32)/0.26);px=lerp(0,12,u);py=lerp(0,-10,u);pr=lerp(0,-12,u);}
  else if(dd>=-0.06&&dd<0.02){const u=eout((dd+0.06)/0.08);px=lerp(12,-48,u);py=lerp(-10,6,u);pr=lerp(-12,24,u);}
  else if(dd>=0.02&&dd<0.45){const u=eio((dd-0.02)/0.43);px=lerp(-48,0,u);py=lerp(6,0,u);pr=lerp(24,0,u);}
  const shut=dd>=-0.045&&dd<0.16; pawOpen.style.display=shut?'none':''; pawClosed.style.display=shut?'':'none';
  paw.setAttribute('transform',`translate(${px} ${py}) rotate(${pr} 1530 560)`);
}
window.__render=render;
window.__P=P; window.__LOOP=NDES; // seamless loop = NDES cycles
// Reduced motion: hold one frame instead of running the belt.
if(!window.__manual){if(matchMedia('(prefers-reduced-motion: reduce)').matches){render(10.5);}else{const t0=performance.now();(function f(now){render(((now-t0)/1000)/P+10);requestAnimationFrame(f)})(t0);}}
})();
