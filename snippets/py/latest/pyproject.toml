[project]
name = "py-latest"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.0",
    "flask>=3.1.3",
    "inngest>=0.5.20",
    "mypy==1.16.1",
    "pydantic>=2.0.0",
    "ruff==0.12.2",
    "werkzeug>=3.1.6",
]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 79
